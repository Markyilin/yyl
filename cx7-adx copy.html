<style type="text/css">.adx {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .pin {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
.swiper-wrapper{
    width: 100%;
    height: 100%;
}
        .box-swiper {
            width: 100%;
            height: 100%;
        }

        .adxswiper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .swiper-slide {
            width: 100%;
            height: auto;
        }

        .swiper-slide a {
            display: block;
            width: 100%;
            height: auto;
        }

        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            margin: 0;
        }
        .swiper-slide .pin img{
            height: auto;
        } 
        @keyframes widthChange {
            0% {
                width: 0;
            }

            100% {
                width: 30px;
            }
        }

        .swiper-pagination-bullets .swiper-pagination-bullet {
            background-color: #585858 !important;
            width: 10px;
            height: 10px;
            overflow: hidden;
            margin: 0 10px;
        }

        .swiper-pagination-bullets .swiper-pagination-bullet-active {
            position: relative;
            width: 30px;
            height: 10px;
            border-radius: 30px;
            background-color: #585858 !important;
            overflow: hidden;

        }

        .swiper-pagination-bullets .swiper-pagination-bullet-active::before {
            content: '';
            position: absolute;
            width: 0;
            height: 10px;
            left: 0;
            top: 0;
            z-index: 222;
            border-radius: 30px;
            background-color: #dcdcdc !important;
            animation: widthChange 5s linear forwards;
            overflow: hidden;
        }

        .swiper-container-horizontal>.swiper-pagination-bullets {
            bottom: 30px;
        }
</style>
<script>
        var mySwiper = new Swiper('.adxswiper', {
