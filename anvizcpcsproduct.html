<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Buy Button Example</title>
</head>

<body>
    <!-- Buy Button Container -->
    <div id="buy-button-container"></div>

    <!-- Shopify Buy Button Embed Script -->
    <script src="https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js"></script>
    <script>
        

        async function getUserLocation() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                return data.country_code;
            } catch (error) {
                console.error('Failed to fetch user location:', error);
                return 'US'; // Default to US if location fetch fails
            }
        }

        async function getProductPriceByCountry(countryCode) {
            const storefrontAccessToken = 'cb23a4a38026fde2353dc4c43badd78b';
            const domain = 'anvizglobal.myshopify.com';
            const productId = 'gid://shopify/Product/8805794906391';
            const marketQuery = {
                'US': 'gid://shopify/Market/YOUR_US_1',
                'CA': 'gid://shopify/Market/YOUR_CA_MARKET_ID',
                'EU': 'gid://shopify/Market/YOUR_EU_MARKET_ID'
            };

            const marketId = marketQuery[countryCode] || marketQuery['US'];

            const query = `
                query {
                    product(id: "${productId}") {
                        priceRangeV2(market: "${marketId}") {
                            minVariantPrice {
                                amount
                                currencyCode
                            }
                        }
                    }
                }
            `;

            try {
                const response = await fetch(`https://${domain}/api/2023-07/graphql.json`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Shopify-Storefront-Access-Token': storefrontAccessToken
                    },
                    body: JSON.stringify({ query })
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const jsonResponse = await response.json();
                return jsonResponse.data.product.priceRangeV2.minVariantPrice;
            } catch (error) {
                console.error('Failed to fetch product price:', error);
                return { amount: '10.00', currencyCode: 'USD' }; // Default to a generic price if API call fails
            }
        }

        async function loadBuyButton() {
            const countryCode = await getUserLocation();
            const productPrice = await getProductPriceByCountry(countryCode);

            const client = ShopifyBuy.buildClient({
                domain: 'anvizglobal.myshopify.com',
                storefrontAccessToken: 'cb23a4a38026fde2353dc4c43badd78b'//YOUR_ACCESS_TOKEN
            });

            const ui = ShopifyBuy.UI.init(client);

            ui.createComponent('product', {
                id: '8805794906391',
                node: document.getElementById('buy-button-container'),
                moneyFormat: '%24%7B%7Bamount%7D%7D', // Customize money format if needed
                options: {
                    product: {
                        iframe: false,
                        templates: {
                            price: `<div class="shopify-buy__price" data-currency="${productPrice.currencyCode}">${productPrice.currencyCode} ${productPrice.amount}</div>`
                        }
                    },
                    cart: {
                        startOpen: false,
                    },
                    toggle: {
                        contents: {
                            count: {
                                text: '{{#data.cart.ItemCount}}',
                            },
                        },
                    },
                },
            });
        }

        loadBuyButton();
    </script>
</body>

</html>
