    <style>
        .modal-dialog {

        .video-nav .left {

            }

                padding-left: 0;

    </style>
    <script>
        function createModal() {
            var modalHTML = `
        <div class="modal fade" id="videoModal" tabindex="-1" role="dialog" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                    <div class="modal-body">
                <video class="modalVideo" style="padding:0;" loop="" muted="" playsinline="" preload="metadata"
                    src="https://cooklife.s3.us-east-1.amazonaws.com/7899c52695aac5c036cd9220d1d24d89.mp4"
                    poster="https://cooklife.us/web/image/7321-512c475b/%E6%88%AA%E5%B1%8F2024-12-09%20%E4%B8%8A%E5%8D%8810.42.57%201.jpg">
                </video>
                    </div>
                </div>
            </div>
        </div>
    `;

            $('body').append(modalHTML);
        }

        $(document).ready(function () {
            createModal();  // Create modal on document ready

            $('.f-btn').click(function () {
                var videoSrc = $('.videoname').attr('src');
                var posterSrc = $('.videoname').attr('poster');
                $('#modalVideo').attr('src', videoSrc);
                $('#modalVideo').attr('poster', posterSrc);
                $('#videoModal').modal('show');
            });

            $('#videoModal').on('hidden.bs.modal', function (e) {
                $('#modalVideo').attr('src', ''); // remove src to stop video
            });

            $('.videoname').hover(function () {
                $(this).get(0).play(); // start video when mouse over
            }, function () {
                $(this).get(0).pause(); // pause video when mouse out
                $(this).get(0).currentTime = 0; // reset video to start
            });
        });

    </script>
