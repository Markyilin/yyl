                    </center>
                    <br>
                    <br>
                  <p></p>
                </td>
              </tr></tbody>
            </table>
          </td>
        </tr>

              <tbody><tr>
                <td valign="middle" align="left" style="color: #000; padding-top: 10px; padding-bottom: 10px; font-size: 12px;">
                  <t t-out="object.company_id.name"></t>

                  <t t-out="object.company_id.phone or ''"></t>

                <td valign="middle" align="right" style="color: #000; padding-top: 10px; padding-bottom: 10px; font-size: 12px;">

                  </t>
