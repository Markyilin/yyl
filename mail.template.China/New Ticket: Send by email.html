<div style="margin: 0px; padding: 0px;">
  <table border="0" width="100%" cellpadding="0" bgcolor="#ededed"
    style="padding: 20px; background-color: #ededed; border-collapse:separate;">
    <tbody>

      <tr>
        <td align="center" style="min-width: 590px;">
          <table width="590" border="0" cellpadding="0" bgcolor="#875A7B"
            style="min-width: 590px; background-color: white; padding: 20px; border-collapse:separate;">
            <tbody>
              <tr>
                <td valign="middle">
                  <span style="font-size:20px; color:#000; font-weight: bold;">

                    <t t-out="object.name"></t>
                  </span>
                </td>

                <td valign="middle" align="right">
                  <img src="https://xup.xthings.com/logo.png?company=1"
                    style="padding: 0px; margin: 0px; height: auto; width: 80px;" alt="{{object.company_id.name}}">
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>


      <tr>
        <td align="center" style="min-width: 590px;">
          <table width="590" border="0" cellpadding="0" bgcolor="#ffffff"
            style="min-width: 590px; background-color: rgb(255, 255, 255); padding: 20px; border-collapse:separate;">
            <tbody>
              <tr>
                <td valign="top" style="font-family:Arial,Helvetica,sans-serif; color: #555; font-size: 14px;">
                  <p style="margin: 0px; padding: 0px; font-size: 13px;">
                    尊敬的
                    <t t-out="object.partner_id.name"></t>
                    ：
                    <br>
                    <br>
                    我们已收到您的请求。
                    <br>
                    <br>
                    我们的支持团队将尽快与您联系。
                    <br>
                    <br>
                    <br>
                  </p>
                  <center>
                    <t t-if="object.company_id.access_for_everyone">
                      <a t-attf-href="{{ object.get_portal_url() }}"
                        style="background-color: #1abc9c; padding: 10px; text-decoration: none; color: #fff; border-radius: 5px; font-size: 16px;"
                        class="o_default_snippet_text">查看工单</a>
                    </t>
                    <t t-else="">
                      <a t-attf-href="/my/helpdesk_tickets/{{ object.id }}"
                        style="background-color: #1abc9c; padding: 10px; text-decoration: none; color: #fff; border-radius: 5px; font-size: 16px;"
                        class="o_default_snippet_text">查看工单</a>
                    </t>
                  </center>
                  <br>
                  <br>
                  <p></p>
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>

      <!-- FOOTER -->
      <tr>
        <td align="center" style="min-width: 590px;">
          <table width="590" border="0" cellpadding="0" bgcolor="#875A7B"
            style="min-width: 590px; background-color: white; padding: 20px; border-collapse:separate;">
            <tbody>
              <tr>
                <td valign="middle" align="left"
                  style="color: #000; padding-top: 10px; padding-bottom: 10px; font-size: 12px;">
                  <t t-out="object.company_id.name"></t>
                  <br>
                  <t t-out="object.company_id.phone or ''"></t>
                </td>
                <td valign="middle" align="right"
                  style="color: #000; padding-top: 10px; padding-bottom: 10px; font-size: 12px;">
                  <t t-if="object.company_id.email">

                  </t>
                  <br>
                  <t t-if="object.company_id.website">

                  </t>
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>
    </tbody>
  </table>
</div>
